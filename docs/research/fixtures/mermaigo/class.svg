<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="280" height="260" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <!-- Inheritance: hollow triangle (end) -->
  <marker id="marker-inheritance" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <polygon points="0 0, 12 6, 0 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Inheritance: hollow triangle (start) -->
  <marker id="marker-inheritance-start" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto-start-reverse">
    <polygon points="12 0, 0 6, 12 12" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Composition: filled diamond (end) -->
  <marker id="marker-composition" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
    <polygon points="0 4, 6 0, 12 4, 6 8" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Composition: filled diamond (start) -->
  <marker id="marker-composition-start" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
    <polygon points="12 4, 6 0, 0 4, 6 8" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Aggregation: hollow diamond (end) -->
  <marker id="marker-aggregation" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
    <polygon points="0 4, 6 0, 12 4, 6 8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Aggregation: hollow diamond (start) -->
  <marker id="marker-aggregation-start" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
    <polygon points="12 4, 6 0, 0 4, 6 8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Association/Dependency: open arrow (end) -->
  <marker id="marker-arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
    <polyline points="0 0, 10 4, 0 8" fill="none" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Association/Dependency: open arrow (start) -->
  <marker id="marker-arrow-start" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
    <polyline points="10 0, 0 4, 10 8" fill="none" stroke="var(--_line)" stroke-width="1" />
  </marker>
</defs>
<polyline  points="140,110 140,150"  fill="none"  stroke="var(--_line)"  stroke-width="1" marker-start="url(#marker-inheritance-start)"/>
<rect  x="40"  y="150"  width="200"  height="70"  fill="var(--_node-fill)"  stroke="var(--_node-stroke)"  stroke-width="1"/>
<line  x1="40"  y1="180"  x2="240"  y2="180"  stroke="var(--_inner-stroke)"  stroke-width="1"/>
<line  x1="40"  y1="200"  x2="240"  y2="200"  stroke="var(--_inner-stroke)"  stroke-width="1"/>
<text  x="140"  y="165"  text-anchor="middle"  dy="0.35em"  font-size="13"  font-weight="600"  fill="var(--_text)">Dog</text>
<rect  x="40"  y="40"  width="200"  height="70"  fill="var(--_node-fill)"  stroke="var(--_node-stroke)"  stroke-width="1"/>
<line  x1="40"  y1="70"  x2="240"  y2="70"  stroke="var(--_inner-stroke)"  stroke-width="1"/>
<line  x1="40"  y1="90"  x2="240"  y2="90"  stroke="var(--_inner-stroke)"  stroke-width="1"/>
<text  x="140"  y="55"  text-anchor="middle"  dy="0.35em"  font-size="13"  font-weight="600"  fill="var(--_text)">Animal</text>
<text  x="48"  y="85"  class="mono"  font-size="11"  fill="var(--_text)">+name: String</text>
<text  x="48"  y="105"  class="mono"  font-size="11"  fill="var(--_text)">+eat()</text>
</svg>