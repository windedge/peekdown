<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <!-- Filled arrow -->
  <marker id="seq-arrow-filled" markerWidth="8.0" markerHeight="4.8" refX="8.0" refY="2.4" orient="auto">
    <polygon points="0 0, 8.0 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <!-- Open arrow -->
  <marker id="seq-arrow-open" markerWidth="8.0" markerHeight="4.8" refX="8.0" refY="2.4" orient="auto">
    <polyline points="0 0, 8.0 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
  <!-- X marker (async lost) -->
  <marker id="seq-arrow-x" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
    <line x1="0" y1="0" x2="10" y2="10" stroke="var(--_arrow)" stroke-width="2" />
    <line x1="10" y1="0" x2="0" y2="10" stroke="var(--_arrow)" stroke-width="2" />
  </marker>
</defs>
<line  x1="90"  y1="90"  x2="90"  y2="230"  stroke="var(--_line)"  stroke-width="1"  stroke-dasharray="4 4"/>
<line  x1="340"  y1="90"  x2="340"  y2="230"  stroke="var(--_line)"  stroke-width="1"  stroke-dasharray="4 4"/>
<rect  x="40"  y="40"  width="100"  height="50"  rx="4" ry="4"  fill="var(--_node-fill)"  stroke="var(--_node-stroke)"  stroke-width="1"/><text  x="90"  y="65"  text-anchor="middle"  dy="0.35em"  font-size="13"  fill="var(--_text)">Alice</text>
<rect  x="290"  y="40"  width="100"  height="50"  rx="4" ry="4"  fill="var(--_node-fill)"  stroke="var(--_node-stroke)"  stroke-width="1"/><text  x="340"  y="65"  text-anchor="middle"  dy="0.35em"  font-size="13"  fill="var(--_text)">Bob</text>
<line  x1="90"  y1="110"  x2="340"  y2="110"  stroke="var(--_line)"  stroke-width="1"  marker-end="url(#seq-arrow-filled)"/>
<text  x="215"  y="105"  text-anchor="middle"  font-size="11"  fill="var(--_text-muted)">Hello Bob</text>
<line  x1="340"  y1="150"  x2="90"  y2="150"  stroke="var(--_line)"  stroke-width="1" stroke-dasharray="4 4"  marker-end="url(#seq-arrow-filled)"/>
<text  x="215"  y="145"  text-anchor="middle"  font-size="11"  fill="var(--_text-muted)">Hi Alice</text>
</svg>