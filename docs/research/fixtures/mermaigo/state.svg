<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 302" width="162" height="302" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8.0" markerHeight="4.8" refX="8.0" refY="2.4" orient="auto">
    <polygon points="0 0, 8.0 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8.0" markerHeight="4.8" refX="0" refY="2.4" orient="auto-start-reverse">
    <polygon points="8.0 0, 0 2.4, 8.0 4.8" fill="var(--_arrow)" />
  </marker>
</defs>
<polyline points="81.0,58.0 81.0,150.8" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="81.0,150.8 81.0,243.6" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<rect x="58.7" y="183.7" width="44.6" height="27.0" rx="4" ry="4" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="81.0" y="197.2" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">start</text>
<circle cx="81.0" cy="58.0" r="16.0" fill="var(--_text)" stroke="none" />
<rect x="50.7" y="132.8" width="60.6" height="36.0" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="40.0" y="225.6" width="82.1" height="36.0" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />

<text x="81.0" y="150.8" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Idle</text>
<text x="81.0" y="243.6" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Running</text>
</svg>