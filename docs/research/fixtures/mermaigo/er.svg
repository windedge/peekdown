<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 134" width="520" height="134" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <!-- Crow's foot: one-or-more -->
  <marker id="crow-many" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto">
    <line x1="0" y1="0" x2="14" y2="6" stroke="var(--_line)" stroke-width="1" />
    <line x1="0" y1="12" x2="14" y2="6" stroke="var(--_line)" stroke-width="1" />
    <line x1="10" y1="0" x2="10" y2="12" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Crow's foot: zero-or-more -->
  <marker id="crow-zero-many" markerWidth="18" markerHeight="12" refX="18" refY="6" orient="auto">
    <circle cx="5" cy="6" r="4" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" />
    <line x1="10" y1="0" x2="18" y2="6" stroke="var(--_line)" stroke-width="1" />
    <line x1="10" y1="12" x2="18" y2="6" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- One: single line -->
  <marker id="crow-one" markerWidth="8" markerHeight="12" refX="8" refY="6" orient="auto">
    <line x1="4" y1="0" x2="4" y2="12" stroke="var(--_line)" stroke-width="1" />
    <line x1="8" y1="0" x2="8" y2="12" stroke="var(--_line)" stroke-width="1" />
  </marker>
  <!-- Zero-or-one -->
  <marker id="crow-zero-one" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
    <circle cx="5" cy="6" r="4" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" />
    <line x1="10" y1="0" x2="10" y2="12" stroke="var(--_line)" stroke-width="1" />
  </marker>
</defs>
<polyline  points="240,67 280,67"  fill="none"  stroke="var(--_line)"  stroke-width="1" marker-start="url(#crow-one)" marker-end="url(#crow-zero-many)"/>
<rect  x="238"  y="57.5"  width="44"  height="19"  rx="4" ry="4"  fill="var(--bg)"  stroke="var(--_inner-stroke)"  stroke-width="0.5"/><text  x="260"  y="67"  text-anchor="middle"  dy="0.35em"  font-size="11"  fill="var(--_text-muted)">places</text>
<rect  x="40"  y="40"  width="200"  height="54"  fill="var(--_node-fill)"  stroke="var(--_node-stroke)"  stroke-width="1"/>
<rect  x="40"  y="40"  width="200"  height="30"  fill="var(--_group-hdr)"  stroke="var(--_node-stroke)"  stroke-width="1"/>
<text  x="140"  y="55"  text-anchor="middle"  dy="0.35em"  font-size="13"  font-weight="600"  fill="var(--_text)">CUSTOMER</text>
<rect  x="280"  y="40"  width="200"  height="54"  fill="var(--_node-fill)"  stroke="var(--_node-stroke)"  stroke-width="1"/>
<rect  x="280"  y="40"  width="200"  height="30"  fill="var(--_group-hdr)"  stroke="var(--_node-stroke)"  stroke-width="1"/>
<text  x="380"  y="55"  text-anchor="middle"  dy="0.35em"  font-size="13"  font-weight="600"  fill="var(--_text)">ORDER</text>
</svg>